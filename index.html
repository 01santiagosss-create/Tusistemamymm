<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Inventario Online</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}
header{
  background:#111827;
  color:white;
  padding:15px;
  text-align:center;
}
.container{
  padding:20px;
}
.card{
  background:white;
  padding:15px;
  margin-bottom:20px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
input{
  width:100%;
  padding:8px;
  margin:6px 0;
}
button{
  padding:8px 14px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
button:hover{
  background:#1e40af;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
canvas{
  background:white;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
<h2>📊 Sistema de Inventario Online</h2>
</header>

<div class="container">

<div class="card">
<h3>➕ Registrar Equipo</h3>
<input id="asset" placeholder="Asset ID">
<input id="tipo" placeholder="Tipo">
<input id="estado" placeholder="Estado">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<button onclick="saveAsset()">Guardar Equipo</button>
</div>

<div class="card">
<h3>📋 Inventario</h3>
<table>
<thead>
<tr>
<th>Asset</th>
<th>Tipo</th>
<th>Estado</th>
<th>Marca</th>
<th>Modelo</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

<div class="card">
<h3>📈 Dashboard de Estadísticas</h3>
<div class="grid">
<canvas id="chartEstados"></canvas>
<canvas id="chartTipos"></canvas>
</div>
</div>

</div>

<script type="module">

// 🔥 PEGA AQUÍ TU CONFIGURACIÓN FIREBASE
const firebaseConfig = {
  apiKey: "AQUI",
  authDomain: "AQUI",
  projectId: "AQUI",
  storageBucket: "AQUI",
  messagingSenderId: "AQUI",
  appId: "AQUI"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// Inicializar Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Guardar equipo
window.saveAsset = async function(){
  if(!asset.value) return alert("Asset ID obligatorio");

  await addDoc(collection(db,"assets"),{
    asset: asset.value,
    tipo: tipo.value,
    estado: estado.value,
    marca: marca.value,
    modelo: modelo.value
  });

  asset.value="";
  tipo.value="";
  estado.value="";
  marca.value="";
  modelo.value="";
};

// Escuchar cambios en tiempo real
let chartEstados, chartTipos;

onSnapshot(collection(db,"assets"), snapshot=>{
  let tablaHTML="";
  let estados={};
  let tipos={};

  snapshot.forEach(doc=>{
    let a=doc.data();

    tablaHTML+=`
      <tr>
        <td>${a.asset}</td>
        <td>${a.tipo}</td>
        <td>${a.estado}</td>
        <td>${a.marca}</td>
        <td>${a.modelo}</td>
      </tr>
    `;

    estados[a.estado]=(estados[a.estado]||0)+1;
    tipos[a.tipo]=(tipos[a.tipo]||0)+1;
  });

  document.getElementById("tabla").innerHTML=tablaHTML;
  renderCharts(estados,tipos);
});

function renderCharts(estados,tipos){

  if(chartEstados) chartEstados.destroy();
  if(chartTipos) chartTipos.destroy();

  chartEstados = new Chart(
    document.getElementById("chartEstados"),
    {
      type:"pie",
      data:{
        labels:Object.keys(estados),
        datasets:[{data:Object.values(estados)}]
      }
    }
  );

  chartTipos = new Chart(
    document.getElementById("chartTipos"),
    {
      type:"bar",
      data:{
        labels:Object.keys(tipos),
        datasets:[{data:Object.values(tipos)}]
      }
    }
  );
}

</script>

</body>
</html>
